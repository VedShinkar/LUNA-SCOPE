name: Bootstrap LUNA-SCOPE labels and milestones

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-project-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  repository-projects: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Create labels, milestones, and organize issues
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const labels = [
              { name: "member-1", color: "1D76DB", description: "Owned by Member 1 — Lunar Terrain & 3D" },
              { name: "member-2", color: "5319E7", description: "Owned by Member 2 — Celestial Mechanics" },
              { name: "member-3", color: "0E8A16", description: "Owned by Member 3 — Mission Intelligence" },
              { name: "shared", color: "BFD4F2", description: "Shared team responsibility" },
              { name: "workstream:terrain", color: "1D76DB", description: "Terrain, geospatial processing and 3D visualization" },
              { name: "workstream:celestial", color: "5319E7", description: "SPICE, Horizons and environmental simulation" },
              { name: "workstream:intelligence", color: "0E8A16", description: "Mission assessment, comparison and AI" },
              { name: "workstream:integration", color: "FBCA04", description: "Shared schemas, integration and interfaces" },
              { name: "workstream:documentation", color: "C2E0C6", description: "Documentation, workflow and demonstration" },
              { name: "priority:P0", color: "B60205", description: "Critical foundation or blocker" },
              { name: "priority:P1", color: "D93F0B", description: "Important core capability" },
              { name: "priority:P2", color: "FBCA04", description: "Enhancement after the core vertical slice" },
              { name: "type:testing", color: "D4C5F9", description: "Testing and scientific validation" },
              { name: "type:integration", color: "F9D0C4", description: "Cross-module integration" },
              { name: "enhancement", color: "A2EEEF", description: "Feature or capability improvement" },
              { name: "documentation", color: "0075CA", description: "Documentation work" }
            ];

            const existingLabels = await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 });
            const labelNames = new Set(existingLabels.map(x => x.name));
            for (const label of labels) {
              if (!labelNames.has(label.name)) {
                await github.rest.issues.createLabel({ owner, repo, ...label });
                core.info(`Created label ${label.name}`);
              } else {
                core.info(`Label already exists: ${label.name}`);
              }
            }

            const milestones = [
              { title: "Phase 0 — Foundations", description: "Coordinate/time conventions, Horizons/SPICE setup, mock fixtures, Git workflow and data contracts." },
              { title: "Phase 1 — First vertical slices", description: "Real regional terrain acquisition and processing, SPICE geometry validation, and initial mission scoring." },
              { title: "Phase 2 — Terrain-aware environment", description: "3D terrain, terrain analysis, horizon visibility, solar power, communication and thermal models." },
              { title: "Phase 3 — Mission intelligence", description: "Scenario comparison, operations/contingencies, grounded Copilot and mission reports." },
              { title: "Phase 4 — Integration & demo", description: "End-to-end integration, regression testing and final demonstration." }
            ];

            const existingMilestones = await github.paginate(github.rest.issues.listMilestones, { owner, repo, state: "all", per_page: 100 });
            const milestoneByTitle = new Map(existingMilestones.map(x => [x.title, x.number]));
            for (const milestone of milestones) {
              if (!milestoneByTitle.has(milestone.title)) {
                const created = await github.rest.issues.createMilestone({ owner, repo, ...milestone });
                milestoneByTitle.set(milestone.title, created.data.number);
                core.info(`Created milestone ${milestone.title}`);
              } else {
                core.info(`Milestone already exists: ${milestone.title}`);
              }
            }

            // Configure the repository-linked user Project V2 fields when the token has project write access.
            try {
              const projectData = await github.graphql(
                `query($owner: String!, $name: String!) {
                  repository(owner: $owner, name: $name) {
                    projectsV2(first: 50) {
                      nodes {
                        id
                        title
                        number
                        fields(first: 100) {
                          nodes {
                            ... on ProjectV2FieldCommon { id name }
                            ... on ProjectV2SingleSelectField { id name options { id name } }
                          }
                        }
                        items(first: 100) {
                          nodes {
                            id
                            content { ... on Issue { number } }
                          }
                        }
                      }
                    }
                  }
                }`,
                { owner, name: repo }
              );

              const project = projectData.repository.projectsV2.nodes.find(p =>
                p.title === "LUNA-SCOPE — Engineering Development Board" || p.title.includes("LUNA-SCOPE")
              );

              if (!project) {
                core.warning("No repository-linked LUNA-SCOPE Project V2 board was visible to this workflow token. Repository labels, milestones and issue metadata are still configured.");
              } else {
                let fieldNames = new Set(project.fields.nodes.map(field => field.name));

                const singleSelectFields = [
                  {
                    name: "Priority",
                    options: [
                      { name: "P0 — Critical", color: "RED", description: "Critical foundation or blocker" },
                      { name: "P1 — Important", color: "ORANGE", description: "Important core capability" },
                      { name: "P2 — Enhancement", color: "YELLOW", description: "Enhancement after the core vertical slice" }
                    ]
                  },
                  {
                    name: "Workstream",
                    options: [
                      { name: "Terrain & Visualization", color: "BLUE", description: "NASA terrain, geospatial processing and 3D" },
                      { name: "Celestial Mechanics", color: "PURPLE", description: "SPICE, Horizons and environmental simulation" },
                      { name: "Mission Intelligence", color: "GREEN", description: "Scoring, comparison, operations and AI" },
                      { name: "Integration", color: "ORANGE", description: "Shared schemas, API integration and testing" },
                      { name: "Documentation", color: "GRAY", description: "Scientific records, workflow and demo" }
                    ]
                  }
                ];

                for (const field of singleSelectFields) {
                  if (!fieldNames.has(field.name)) {
                    await github.graphql(
                      `mutation($projectId: ID!, $name: String!, $options: [ProjectV2SingleSelectFieldOptionInput!]!) {
                        createProjectV2Field(input: {
                          projectId: $projectId,
                          dataType: SINGLE_SELECT,
                          name: $name,
                          singleSelectOptions: $options
                        }) {
                          projectV2Field { ... on ProjectV2SingleSelectField { id name } }
                        }
                      }`,
                      { projectId: project.id, name: field.name, options: field.options }
                    );
                    core.info(`Created Project field: ${field.name}`);
                  } else {
                    core.info(`Project field already exists: ${field.name}`);
                  }
                }

                if (!fieldNames.has("Target Date")) {
                  await github.graphql(
                    `mutation($projectId: ID!, $name: String!) {
                      createProjectV2Field(input: { projectId: $projectId, dataType: DATE, name: $name }) {
                        projectV2Field { ... on ProjectV2Field { id name } }
                      }
                    }`,
                    { projectId: project.id, name: "Target Date" }
                  );
                  core.info("Created Project field: Target Date");
                }

                const refreshed = await github.graphql(
                  `query($projectId: ID!) {
                    node(id: $projectId) {
                      ... on ProjectV2 {
                        fields(first: 100) {
                          nodes {
                            ... on ProjectV2SingleSelectField { id name options { id name } }
                          }
                        }
                        items(first: 100) {
                          nodes {
                            id
                            content { ... on Issue { number } }
                          }
                        }
                      }
                    }
                  }`,
                  { projectId: project.id }
                );

                const fields = refreshed.node.fields.nodes;
                const items = refreshed.node.items.nodes;
                const priorityField = fields.find(f => f.name === "Priority");
                const workstreamField = fields.find(f => f.name === "Workstream");
                const itemByIssue = new Map(items.filter(i => i.content?.number).map(i => [i.content.number, i.id]));

                const issueValues = {
                  1:["P0 — Critical","Integration"], 2:["P0 — Critical","Terrain & Visualization"],
                  3:["P0 — Critical","Celestial Mechanics"], 4:["P0 — Critical","Mission Intelligence"],
                  5:["P0 — Critical","Terrain & Visualization"], 6:["P1 — Important","Terrain & Visualization"],
                  7:["P0 — Critical","Terrain & Visualization"], 8:["P1 — Important","Terrain & Visualization"],
                  9:["P1 — Important","Terrain & Visualization"], 10:["P0 — Critical","Celestial Mechanics"],
                  11:["P0 — Critical","Celestial Mechanics"], 12:["P0 — Critical","Celestial Mechanics"],
                  13:["P1 — Important","Celestial Mechanics"], 14:["P1 — Important","Celestial Mechanics"],
                  15:["P0 — Critical","Celestial Mechanics"], 16:["P0 — Critical","Integration"],
                  17:["P1 — Important","Mission Intelligence"], 18:["P1 — Important","Mission Intelligence"],
                  19:["P2 — Enhancement","Mission Intelligence"], 20:["P2 — Enhancement","Mission Intelligence"],
                  21:["P1 — Important","Mission Intelligence"], 22:["P0 — Critical","Integration"],
                  23:["P0 — Critical","Integration"], 24:["P0 — Critical","Documentation"],
                  25:["P1 — Important","Documentation"]
                };

                for (const [issueNumberText, values] of Object.entries(issueValues)) {
                  const issueNumber = Number(issueNumberText);
                  const itemId = itemByIssue.get(issueNumber);
                  if (!itemId) {
                    core.warning(`Issue #${issueNumber} is not currently on the Project board; skipped custom field values.`);
                    continue;
                  }
                  for (const [field, valueName] of [[priorityField, values[0]], [workstreamField, values[1]]]) {
                    const option = field?.options.find(o => o.name === valueName);
                    if (!field || !option) continue;
                    await github.graphql(
                      `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                        updateProjectV2ItemFieldValue(input: {
                          projectId: $projectId,
                          itemId: $itemId,
                          fieldId: $fieldId,
                          value: { singleSelectOptionId: $optionId }
                        }) { projectV2Item { id } }
                      }`,
                      { projectId: project.id, itemId, fieldId: field.id, optionId: option.id }
                    );
                  }
                }
                core.notice("Project V2 Priority and Workstream fields configured and populated for available issues.");
              }
            } catch (error) {
              core.warning(`Project V2 field setup could not be completed automatically: ${error.message}`);
            }

            const assignments = {
              1:  { labels: ["shared", "workstream:integration", "priority:P0"], milestone: "Phase 0 — Foundations" },
              2:  { labels: ["member-1", "workstream:terrain", "priority:P0"], milestone: "Phase 1 — First vertical slices" },
              3:  { labels: ["member-2", "workstream:celestial", "priority:P0"], milestone: "Phase 0 — Foundations" },
              4:  { labels: ["member-3", "workstream:intelligence", "priority:P0"], milestone: "Phase 0 — Foundations" },
              5:  { labels: ["member-1", "workstream:terrain", "priority:P0"], milestone: "Phase 1 — First vertical slices" },
              6:  { labels: ["member-1", "workstream:terrain", "priority:P1"], milestone: "Phase 1 — First vertical slices" },
              7:  { labels: ["member-1", "workstream:terrain", "priority:P0"], milestone: "Phase 1 — First vertical slices" },
              8:  { labels: ["member-1", "workstream:terrain", "priority:P1"], milestone: "Phase 2 — Terrain-aware environment" },
              9:  { labels: ["member-1", "workstream:terrain", "priority:P1"], milestone: "Phase 2 — Terrain-aware environment" },
              10: { labels: ["member-2", "workstream:celestial", "priority:P0"], milestone: "Phase 1 — First vertical slices" },
              11: { labels: ["member-2", "workstream:celestial", "priority:P0"], milestone: "Phase 1 — First vertical slices" },
              12: { labels: ["member-2", "workstream:celestial", "priority:P0"], milestone: "Phase 2 — Terrain-aware environment" },
              13: { labels: ["member-2", "workstream:celestial", "priority:P1"], milestone: "Phase 2 — Terrain-aware environment" },
              14: { labels: ["member-2", "workstream:celestial", "priority:P1"], milestone: "Phase 2 — Terrain-aware environment" },
              15: { labels: ["member-2", "workstream:celestial", "priority:P0"], milestone: "Phase 1 — First vertical slices" },
              16: { labels: ["shared", "workstream:integration", "priority:P0"], milestone: "Phase 0 — Foundations" },
              17: { labels: ["member-3", "workstream:intelligence", "priority:P1"], milestone: "Phase 1 — First vertical slices" },
              18: { labels: ["member-3", "workstream:intelligence", "priority:P1"], milestone: "Phase 1 — First vertical slices" },
              19: { labels: ["member-3", "workstream:intelligence", "priority:P2"], milestone: "Phase 3 — Mission intelligence" },
              20: { labels: ["member-3", "workstream:intelligence", "priority:P2"], milestone: "Phase 3 — Mission intelligence" },
              21: { labels: ["member-3", "workstream:intelligence", "priority:P1", "documentation"], milestone: "Phase 3 — Mission intelligence" },
              22: { labels: ["shared", "workstream:integration", "priority:P0", "type:integration"], milestone: "Phase 4 — Integration & demo" },
              23: { labels: ["shared", "workstream:integration", "priority:P0", "type:testing"], milestone: "Phase 4 — Integration & demo" },
              24: { labels: ["shared", "workstream:documentation", "priority:P0", "documentation"], milestone: "Phase 0 — Foundations" },
              25: { labels: ["shared", "workstream:documentation", "priority:P1", "documentation"], milestone: "Phase 4 — Integration & demo" }
            };

            for (const [numberText, assignment] of Object.entries(assignments)) {
              const issue_number = Number(numberText);
              const issue = await github.rest.issues.get({ owner, repo, issue_number });
              if (issue.data.pull_request) continue;
              const existing = issue.data.labels.map(x => typeof x === "string" ? x : x.name);
              const merged = [...new Set([...existing, ...assignment.labels])];
              await github.rest.issues.update({
                owner, repo, issue_number,
                labels: merged,
                milestone: milestoneByTitle.get(assignment.milestone)
              });
              core.info(`Organized issue #${issue_number}: ${assignment.milestone}`);
            }

            core.notice("LUNA-SCOPE labels, milestones and issue assignments are configured.");
